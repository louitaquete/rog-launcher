[package]
name = "rog-launcher"
version = "0.1.0"
description = "Rog Launcher — launcher para Minecraft: Java Edition"
authors = ["louitaquete"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rog_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Abre o jogo com conta offline. Só para testar enquanto o login Microsoft não é aprovado:
# nunca habilitar em versões distribuídas (as regras da Mojang exigem login).
dev-offline = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "socks"] }
sha1 = "0.11.0"
hex = "0.4.3"
futures = "0.3.34"
tokio = { version = "1.54.1", features = ["fs", "sync", "time", "macros", "rt", "process", "io-util"] }
md5 = { package = "md-5", version = "0.11.0" }
zip = { version = "2", default-features = false, features = ["deflate"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
winreg = "0.55"
