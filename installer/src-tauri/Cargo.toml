[package]
name = "rog-installer"
version = "0.1.0"
description = "Instalador do Rog Launcher"
authors = ["louitaquete"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "socks", "stream"] }
futures = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt", "macros"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
