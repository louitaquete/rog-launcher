name: Build (Windows)

on:
  push:
    branches: [main, "exp/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          # Versão normal: abrir o jogo exige login Microsoft.
          - name: rog-launcher-windows
            args: ""
          # Só para testar enquanto o login não é aprovado. Não distribuir.
          - name: rog-launcher-windows-DEV-offline
            args: "--features dev-offline"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}
      - run: npm ci
      - run: npm run tauri build -- ${{ matrix.args }}
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}${{ startsWith(github.ref, 'refs/heads/exp/') && '-EXPERIMENTAL' || '' }}
          retention-days: ${{ matrix.args == '' && 30 || 3 }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
      # Tag v* (ex.: v0.2.0): publica a release que o launcher usa para avisar de atualização.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') && matrix.args == ''
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: Rog Launcher ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe

  # Instalador próprio (installer/): um .exe pequeno que baixa o launcher da release.
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: installer/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compilar instalador
        working-directory: installer/src-tauri
        run: npx -y @tauri-apps/cli@2 build --no-bundle
      - name: Renomear
        shell: pwsh
        run: Copy-Item "installer/src-tauri/target/release/rog-installer.exe" "Rog-Launcher-Installer.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: rog-launcher-installer
          retention-days: 30
          path: Rog-Launcher-Installer.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: Rog Launcher ${{ github.ref_name }}
          files: Rog-Launcher-Installer.exe
