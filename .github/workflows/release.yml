name: Release

# Para publicar: escreva a versão (ex.: 0.1.0-prealpha) no arquivo RELEASE e faça push no main.
on:
  push:
    branches: [main]
    paths: ["RELEASE"]

permissions:
  contents: write

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: rog-launcher-windows
      - run: npm ci
      - run: npm run tauri build
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: installer/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: installer/src-tauri
        run: npx -y @tauri-apps/cli@2 build --no-bundle
      - shell: pwsh
        run: Copy-Item "installer/src-tauri/target/release/rog-installer.exe" "Rog-Launcher-Installer.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: Rog-Launcher-Installer.exe

  publish:
    needs: [launcher, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: echo "version=$(tr -d '[:space:]' < RELEASE)" >> "$GITHUB_OUTPUT"
      # Patch notes: títulos dos commits desde a release anterior (sem os de versão).
      - name: Notas da versão
        run: |
          prev=$(git tag --sort=-creatordate | head -n1)
          range=${prev:+$prev..HEAD}
          git log $range --no-merges --pretty='- %s' | grep -viE '^- (Bump version|Versão [0-9]|Release v)' > notes.md || true
          [ -s notes.md ] || echo "- Melhorias e correções" > notes.md
          {
            echo
            echo "---"
            echo "**Como instalar:** baixe o \`Rog-Launcher-Installer.exe\`, abra e clique em Instalar. Se o Windows avisar que o arquivo é desconhecido, clique em *Mais informações → Executar assim mesmo*."
            echo
            echo "Não é um produto oficial do Minecraft. Não é aprovado nem associado à Mojang ou à Microsoft."
          } >> notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Rog Launcher v${{ steps.v.outputs.version }}
          prerelease: ${{ contains(steps.v.outputs.version, '-') }}
          body_path: notes.md
          files: out/*.exe
